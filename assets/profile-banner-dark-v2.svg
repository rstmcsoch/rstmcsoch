<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Rustam Chaturvedi</title>
  <desc id="desc">Profile banner with a soft gradient glow and a continuously rotating geometric flower, clipped within the right-hand decorative area.</desc>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050914"/><stop offset=".55" stop-color="#0A1020"/><stop offset="1" stop-color="#10101B"/></linearGradient>
    <radialGradient id="blueGlow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#2563EB" stop-opacity=".48"/><stop offset=".42" stop-color="#1D4ED8" stop-opacity=".19"/><stop offset="1" stop-color="#1D4ED8" stop-opacity="0"/></radialGradient>
    <radialGradient id="amberGlow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#F97316" stop-opacity=".62"/><stop offset=".28" stop-color="#EA580C" stop-opacity=".34"/><stop offset=".62" stop-color="#B45309" stop-opacity=".13"/><stop offset="1" stop-color="#B45309" stop-opacity="0"/></radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FB923C"/><stop offset=".55" stop-color="#FBBF24"/><stop offset="1" stop-color="#FDE68A"/></linearGradient>
<clipPath id="flowerSafeClip" clipPathUnits="userSpaceOnUse"><rect x="0" y="0" width="1200" height="300" rx="22"/></clipPath>
    <path id="lp" d="M0,-14 C24,-30 24,-56 0,-72 C-24,-56 -24,-30 0,-14 Z"/>
    <clipPath id="lo"><path clip-rule="evenodd" d="M-120,-120 H120 V120 H-120 Z M35,0 a35,35 0 1,0 -70,0 a35,35 0 1,0 70,0 Z"/></clipPath><clipPath id="li"><circle r="35"/></clipPath>
    <g id="lko"><g clip-path="url(#lo)"><use xlink:href="#lp" fill="none" stroke="#000" stroke-width="7.4" stroke-linejoin="round"/></g></g><g id="lki"><g clip-path="url(#li)"><use xlink:href="#lp" fill="none" stroke="#000" stroke-width="7.4" stroke-linejoin="round"/></g></g>
    <mask id="lm0" maskUnits="userSpaceOnUse" x="-120" y="-120" width="240" height="240"><rect x="-120" y="-120" width="240" height="240" fill="#fff"/><use xlink:href="#lko" transform="rotate(45)"/><use xlink:href="#lki" transform="rotate(-45)"/></mask><mask id="lm1" maskUnits="userSpaceOnUse" x="-120" y="-120" width="240" height="240"><rect x="-120" y="-120" width="240" height="240" fill="#fff"/><use xlink:href="#lko" transform="rotate(90)"/><use xlink:href="#lki" transform="rotate(0)"/></mask><mask id="lm2" maskUnits="userSpaceOnUse" x="-120" y="-120" width="240" height="240"><rect x="-120" y="-120" width="240" height="240" fill="#fff"/><use xlink:href="#lko" transform="rotate(135)"/><use xlink:href="#lki" transform="rotate(45)"/></mask><mask id="lm3" maskUnits="userSpaceOnUse" x="-120" y="-120" width="240" height="240"><rect x="-120" y="-120" width="240" height="240" fill="#fff"/><use xlink:href="#lko" transform="rotate(180)"/><use xlink:href="#lki" transform="rotate(90)"/></mask><mask id="lm4" maskUnits="userSpaceOnUse" x="-120" y="-120" width="240" height="240"><rect x="-120" y="-120" width="240" height="240" fill="#fff"/><use xlink:href="#lko" transform="rotate(225)"/><use xlink:href="#lki" transform="rotate(135)"/></mask><mask id="lm5" maskUnits="userSpaceOnUse" x="-120" y="-120" width="240" height="240"><rect x="-120" y="-120" width="240" height="240" fill="#fff"/><use xlink:href="#lko" transform="rotate(270)"/><use xlink:href="#lki" transform="rotate(180)"/></mask><mask id="lm6" maskUnits="userSpaceOnUse" x="-120" y="-120" width="240" height="240"><rect x="-120" y="-120" width="240" height="240" fill="#fff"/><use xlink:href="#lko" transform="rotate(315)"/><use xlink:href="#lki" transform="rotate(225)"/></mask><mask id="lm7" maskUnits="userSpaceOnUse" x="-120" y="-120" width="240" height="240"><rect x="-120" y="-120" width="240" height="240" fill="#fff"/><use xlink:href="#lko" transform="rotate(360)"/><use xlink:href="#lki" transform="rotate(270)"/></mask>
  </defs>
  <rect width="1200" height="300" rx="22" fill="url(#base)"/>
  <ellipse cx="1055" cy="55" rx="300" ry="205" fill="url(#blueGlow)"/>
  <ellipse cx="1080" cy="300" rx="350" ry="270" fill="url(#amberGlow)"/>
  <ellipse cx="1000" cy="210" rx="210" ry="160" fill="url(#amberGlow)" opacity=".34"/>

  <g clip-path="url(#flowerSafeClip)">
    <g id="animatedFlower">
      <g transform="translate(1080 150) scale(2.2)">
        <g fill="none" stroke="#FFFAF2" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><g mask="url(#lm0)"><use xlink:href="#lp"/></g><g mask="url(#lm1)"><use xlink:href="#lp" transform="rotate(45)"/></g><g mask="url(#lm2)"><use xlink:href="#lp" transform="rotate(90)"/></g><g mask="url(#lm3)"><use xlink:href="#lp" transform="rotate(135)"/></g><g mask="url(#lm4)"><use xlink:href="#lp" transform="rotate(180)"/></g><g mask="url(#lm5)"><use xlink:href="#lp" transform="rotate(225)"/></g><g mask="url(#lm6)"><use xlink:href="#lp" transform="rotate(270)"/></g><g mask="url(#lm7)"><use xlink:href="#lp" transform="rotate(315)"/></g><path d="M0,-7 L7,0 L0,7 L-7,0 Z" fill="#FFFAF2" stroke="none"/><circle r="90" stroke-width=".7" opacity=".7"/><g fill="#FFFAF2" stroke="none"><circle cy="-82" r="1.8"/><circle cy="-82" r="1.8" transform="rotate(45)"/><circle cy="-82" r="1.8" transform="rotate(90)"/><circle cy="-82" r="1.8" transform="rotate(135)"/><circle cy="-82" r="1.8" transform="rotate(180)"/><circle cy="-82" r="1.8" transform="rotate(225)"/><circle cy="-82" r="1.8" transform="rotate(270)"/><circle cy="-82" r="1.8" transform="rotate(315)"/></g></g>
      </g>
      <animateTransform attributeName="transform" type="rotate" from="0 1080 150" to="360 1080 150" dur="64s" repeatCount="indefinite"/>
    </g>
  </g>
  <text x="60" y="74" fill="#FDBA74" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="750" letter-spacing="3.8">HELLO, I'M</text>
  <text x="58" y="142" fill="#FAFAFA" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="53" font-weight="750" letter-spacing="-1.5">Rustam Chaturvedi</text>
  <rect x="60" y="163" width="112" height="4" rx="2" fill="url(#line)"/>
  <text x="60" y="207" fill="#E7E5E4" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="550">Development · AI Agents · Automation</text>
  <text x="60" y="244" fill="#A8A29E" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16">Learning by building, one useful project at a time.</text>
</svg>