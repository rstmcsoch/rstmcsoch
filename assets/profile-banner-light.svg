<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Rustam Chaturvedi</title>
  <desc id="desc">A clean light profile banner with a soft orange, saffron and gold circular glow on the right.</desc>
  <defs>
    <radialGradient id="warmOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity=".82"/>
      <stop offset="28%" stop-color="#FBBF24" stop-opacity=".54"/>
      <stop offset="58%" stop-color="#F97316" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#F97316" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="softWhite" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity=".95"/>
      <stop offset="72%" stop-color="#FFFBEB" stop-opacity=".34"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="55%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <circle cx="1020" cy="155" r="245" fill="url(#warmOrb)"/>
  <circle cx="1080" cy="165" r="175" fill="url(#softWhite)" opacity=".58"/>
  <circle cx="1024" cy="158" r="135" fill="none" stroke="#D97706" stroke-opacity=".18"/>
  <circle cx="1024" cy="158" r="171" fill="none" stroke="#F59E0B" stroke-opacity=".16" stroke-dasharray="2 10"/>
  <circle cx="1110" cy="90" r="3" fill="#F59E0B" opacity=".65">
    <animate attributeName="opacity" values=".25;.85;.25" dur="3.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="935" cy="226" r="2.5" fill="#EA580C" opacity=".55">
    <animate attributeName="opacity" values=".6;.15;.6" dur="4.6s" repeatCount="indefinite"/>
  </circle>
  <path d="M870 88 C930 42 1045 28 1110 60" fill="none" stroke="#F59E0B" stroke-opacity=".24" stroke-width="1.5" stroke-linecap="round"/>
  <text x="60" y="74" fill="#9A3412" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="750" letter-spacing="3.8">HELLO, I'M</text>
  <text x="58" y="142" fill="#171717" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="53" font-weight="750" letter-spacing="-1.5">Rustam Chaturvedi</text>
  <rect x="60" y="163" width="112" height="4" rx="2" fill="url(#accentLine)"/>
  <text x="60" y="207" fill="#292524" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="550">Web Development · AI Agents · Automation</text>
  <text x="60" y="244" fill="#78716C" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16">Learning by building, one useful project at a time.</text>
</svg>