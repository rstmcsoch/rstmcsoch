<svg xmlns="http://www.w3.org/2000/svg" width="184" height="48" viewBox="0 0 184 48" role="img" aria-labelledby="title desc">
  <title id="title">Day and night theme</title>
  <desc id="desc">An animated sun and moon switch motif. In the README it links to GitHub appearance settings.</desc>
  <defs>
    <linearGradient id="warmTrack" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <linearGradient id="knobFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  <rect x=".75" y=".75" width="182.5" height="46.5" rx="23.25" fill="#18181B" stroke="#F59E0B" stroke-opacity=".62" stroke-width="1.5"/>
  <text x="16" y="29" fill="#F5F5F4" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="750" letter-spacing="1.25">THEME</text>
  <rect x="77" y="7" width="98" height="34" rx="17" fill="#27272A" stroke="#A1A1AA" stroke-opacity=".35"/>
  <circle cx="93" cy="24" r="11.5" fill="url(#knobFill)" stroke="#FFFBEB" stroke-opacity=".75">
    <animate attributeName="cx" values="94;158;94" dur="6s" repeatCount="indefinite"/>
  </circle>
  <g transform="translate(94 24)" stroke="#78350F" stroke-width="1.7" stroke-linecap="round" fill="none">
    <animateTransform attributeName="transform" type="translate" values="94 24;158 24;94 24" dur="6s" repeatCount="indefinite" additive="replace"/>
    <circle r="3.8" fill="#78350F" stroke="none"/>
    <path d="M0 -7V-5.8 M0 5.8V7 M-7 0H-5.8 M5.8 0H7 M-5 -5L-4.2 -4.2 M4.2 4.2L5 5 M-5 5L-4.2 4.2 M4.2 -4.2L5 -5"/>
    <animate attributeName="opacity" values="1;.15;1" dur="6s" repeatCount="indefinite"/>
  </g>
  <g transform="translate(94 24)" fill="#78350F" opacity="0">
    <animateTransform attributeName="transform" type="translate" values="94 24;158 24;94 24" dur="6s" repeatCount="indefinite" additive="replace"/>
    <path d="M2 -7.5A7.5 7.5 0 1 0 7.2 3.5A6.1 6.1 0 0 1 2 -7.5Z"/>
    <animate attributeName="opacity" values="0;1;0" dur="6s" repeatCount="indefinite"/>
  </g>
  <circle cx="158" cy="24" r="2" fill="#FDE68A" opacity=".9">
    <animate attributeName="opacity" values=".25;.9;.25" dur="2.4s" repeatCount="indefinite"/>
  </circle>
</svg>