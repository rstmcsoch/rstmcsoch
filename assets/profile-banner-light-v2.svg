<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Rustam Chaturvedi</title>
  <desc id="desc">Profile banner with a soft gradient glow and a continuously rotating geometric flower, clipped within the right-hand decorative area.</desc>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFEFC"/><stop offset=".6" stop-color="#FFFDF8"/><stop offset="1" stop-color="#FFF7ED"/></linearGradient>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#FBBF24" stop-opacity=".48"/><stop offset=".36" stop-color="#F97316" stop-opacity=".19"/><stop offset="1" stop-color="#F97316" stop-opacity="0"/></radialGradient>
    <radialGradient id="softBlue" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#60A5FA" stop-opacity=".18"/><stop offset="1" stop-color="#60A5FA" stop-opacity="0"/></radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#EA580C"/><stop offset=".55" stop-color="#F59E0B"/><stop offset="1" stop-color="#D97706"/></linearGradient>
<clipPath id="flowerSafeClip" clipPathUnits="userSpaceOnUse"><rect x="0" y="0" width="1200" height="300" rx="22"/></clipPath>
    <path id="lp" d="M-4.54,-17.37 C-3.13,-16.21 -1.62,-15.08 0,-14 C8.71,-19.81 14.26,-26.93 16.65,-34.42 M17.4,-48.76 C15.6,-57.26 9.8,-65.47 0,-72 C-17.15,-60.56 -22.05,-44.02 -14.68,-29.67"/>
  </defs>
  <rect width="1200" height="300" rx="22" fill="url(#base)"/>
  <ellipse cx="1050" cy="70" rx="290" ry="200" fill="url(#softBlue)"/>
  <ellipse cx="1080" cy="300" rx="360" ry="270" fill="url(#goldGlow)"/>
  <ellipse cx="1000" cy="210" rx="220" ry="160" fill="url(#goldGlow)" opacity=".5"/>

  <g clip-path="url(#flowerSafeClip)">
    <g id="animatedFlower">
      <g transform="translate(1080 185) scale(1.87)">
        <g fill="none" stroke="#FFFAF2" stroke-width="2.6" stroke-linejoin="round"><use xlink:href="#lp"/><use xlink:href="#lp" transform="rotate(45)"/><use xlink:href="#lp" transform="rotate(90)"/><use xlink:href="#lp" transform="rotate(135)"/><use xlink:href="#lp" transform="rotate(180)"/><use xlink:href="#lp" transform="rotate(225)"/><use xlink:href="#lp" transform="rotate(270)"/><use xlink:href="#lp" transform="rotate(315)"/><path d="M0,-7 L7,0 L0,7 L-7,0 Z" fill="#FFFAF2" stroke="none"/><g fill="#FFFAF2" stroke="none"><circle cy="-82" r="1.8"/><circle cy="-82" r="1.8" transform="rotate(45)"/><circle cy="-82" r="1.8" transform="rotate(90)"/><circle cy="-82" r="1.8" transform="rotate(135)"/><circle cy="-82" r="1.8" transform="rotate(180)"/><circle cy="-82" r="1.8" transform="rotate(225)"/><circle cy="-82" r="1.8" transform="rotate(270)"/><circle cy="-82" r="1.8" transform="rotate(315)"/></g></g>
      </g>
      <animateTransform attributeName="transform" type="rotate" from="0 1080 185" to="360 1080 185" dur="64s" repeatCount="indefinite"/>
    </g>
  </g>
  <text x="60" y="74" fill="#9A3412" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="750" letter-spacing="3.8">HELLO, I'M</text>
  <text x="58" y="142" fill="#1C1917" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="53" font-weight="750" letter-spacing="-1.5">Rustam Chaturvedi</text>
  <rect x="60" y="163" width="112" height="4" rx="2" fill="url(#line)"/>
  <text x="60" y="207" fill="#292524" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="550">Development · AI Agents · Automation</text>
  <text x="60" y="244" fill="#78716C" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16">Learning by building, one useful project at a time.</text>
</svg>